plugins {
    id 'com.android.application' version '8.13.2'
}

def doiHost = providers.gradleProperty('doiHost').getOrElse('doi.example.invalid')
        .toLowerCase(Locale.ROOT)
if (!(doiHost ==~ /[a-z0-9](?:[a-z0-9-]*[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]*[a-z0-9])?)+/)) {
    throw new GradleException('Set doiHost to a hostname without a scheme, port, or path.')
}

android {
    namespace 'dev.pages.doicouple'
    compileSdk 36

    defaultConfig {
        applicationId 'dev.pages.doicouple'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '1.1.0'
        buildConfigField 'String', 'DOI_HOST', '"' + doiHost + '"'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
}
